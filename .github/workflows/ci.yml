name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix client install --no-audit --no-fund
          npm --prefix worker install --no-audit --no-fund
      - name: Typecheck client
        run: npx --prefix client tsc --noEmit -p client/tsconfig.json
      - name: Typecheck worker
        run: npx --prefix worker tsc --noEmit -p worker/tsconfig.json
      - name: Unit tests
        run: npm test
      - name: Validate shipped packs
        run: npm run packs:validate
